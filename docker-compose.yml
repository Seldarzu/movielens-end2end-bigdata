# Takım: Arzu (Kıdemli Mühendis)
# Tüm servisleri ayağa kaldıran docker-compose dosyası
# Servisler: Zookeeper, Kafka, Kafka Producer, Spark Master, Spark Worker, MLflow


networks:
  pipeline-net:
    driver: bridge

services:

  # ─── Zookeeper ─────────────────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - pipeline-net
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Kafka Broker ──────────────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # İç ağdan Spark erişimi için kafka:29092, host makineden localhost:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - pipeline-net
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ─── Kafka Producer ───────────────────────────────────────────────────────
  kafka-producer:
    build:
      context: .
      dockerfile: Dockerfile.producer
    container_name: kafka-producer
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./kafka:/app/kafka         # producer.py
      - ./data/ml-25m:/app/data    # ratings.csv (konteyner içinde /app/data/ratings.csv)
    networks:
      - pipeline-net
    restart: on-failure            # Hata olursa otomatik yeniden başlat

  # ─── Spark Master ──────────────────────────────────────────────────────────
  spark-master:
    build:
      context: .
      dockerfile: Dockerfile.spark
    container_name: spark-master
    environment:
      - SPARK_NO_DAEMONIZE=true
    entrypoint: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    ports:
      - "8081:8080"   # Spark Web UI (8080 başka konteyner tarafından kullanılıyor)
      - "7077:7077"   # Spark Master port
    volumes:
      - ./spark:/app/spark              # Spark uygulama kodları
      - ./data/ml-25m:/app/data         # MovieLens ham veri (ml-25m alt klasörü)
      - ./delta:/app/delta              # Delta Lake çıktıları
      - ./mlflow:/mlflow                # MLflow artifact yazma erişimi
    networks:
      - pipeline-net

  # ─── Spark Worker ──────────────────────────────────────────────────────────
  spark-worker:
    build:
      context: .
      dockerfile: Dockerfile.spark
    container_name: spark-worker
    entrypoint: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      - SPARK_WORKER_MEMORY=2g
      - SPARK_WORKER_CORES=2
      - SPARK_NO_DAEMONIZE=true
    depends_on:
      - spark-master
    volumes:
      - ./spark:/app/spark
      - ./data/ml-25m:/app/data
      - ./delta:/app/delta
      - ./mlflow:/mlflow                # MLflow artifact yazma erişimi
    networks:
      - pipeline-net

  # ─── MLflow Tracking Server ────────────────────────────────────────────────
  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    container_name: mlflow
    environment:
      - MLFLOW_HOST=0.0.0.0
    ports:
      - "5000:5000"
    volumes:
      - ./mlflow:/mlflow   # MLflow metadata ve artifact deposu
    networks:
      - pipeline-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 20s
      timeout: 10s
      retries: 5

  # ─── Streamlit Dashboard ───────────────────────────────────────────────────
  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: streamlit-dashboard
    ports:
      - "8501:8501"
    volumes:
      - ./dashboard:/app/dashboard
      - ./delta:/app/delta
      - ./mlflow:/mlflow
    networks:
      - pipeline-net
    restart: on-failure
